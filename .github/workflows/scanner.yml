name: V4 vs V10 Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Historische Tage'
        required: true
        default: '30'
      markets:
        description: 'Anzahl Coins (erst 30, dann 100 oder 400)'
        required: true
        default: '30'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backtest starten
        run: python -u scanner.py --days '${{ inputs.days }}' --markets '${{ inputs.markets }}'
      - name: Backtest-Ergebnisse speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-ergebnisse
          path: |
            backtest_trades.csv
            backtest_filters.csv
          if-no-files-found: warn
          retention-days: 30
